name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile app.py panel_install.py panel_update.py

      - name: Check shell scripts
        run: bash -n install.sh docker/palworld-entrypoint.sh

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          docker compose --env-file .env config

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor claimed by the README badge; 3.13 is what dev runs.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        # No path overrides: the suite must be hermetic on a bare host. Pointing
        # the paths at runner.temp used to hide tests that wrote to /home/demo,
        # which then failed the moment they ran anywhere else.
        env:
          PANEL_SECRET_KEY: ci-test-secret
        run: python -m pytest tests/ -q --tb=short
