name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile app.py panel_install.py panel_update.py

      - name: Check shell scripts
        run: bash -n install.sh docker/palworld-entrypoint.sh

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          docker compose --env-file .env config

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor claimed by the README badge; 3.13 is what dev runs.
        python-version: ["3.10", "3.13"]

    # The suite must not assume /home/demo exists or is writable -- CI runners
    # are not root. Point every writable path at a temp directory instead.
    env:
      PALWORLD_DIR: ${{ runner.temp }}/panel-ci/palworld
      CONFIG_BACKUP_DIR: ${{ runner.temp }}/panel-ci/panel/config-backups
      AUDIT_LOG: ${{ runner.temp }}/panel-ci/panel/audit.log
      SAVE_SLOT_ROOT: ${{ runner.temp }}/panel-ci/panel/save-slots
      MOD_LIBRARY_ROOT: ${{ runner.temp }}/panel-ci/panel/mod-library
      PANEL_UPDATE_STATUS: ${{ runner.temp }}/panel-ci/panel/update-status.json
      PANEL_UPDATE_LOG: ${{ runner.temp }}/panel-ci/panel/update.log
      PANEL_INSTALL_STATUS: ${{ runner.temp }}/panel-ci/panel/install-status.json
      PANEL_INSTALL_LOG: ${{ runner.temp }}/panel-ci/panel/install.log
      PANEL_SECRET_KEY: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
